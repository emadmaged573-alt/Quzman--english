<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quzman in English</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Cairo', sans-serif; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      function App() {
        const [view, setView] = useState('home');
        const [passcode, setPasscode] = useState('');
        const [isTeacher, setIsTeacher] = useState(false);
        const [error, setError] = useState('');

        const handleTeacherLogin = (e) => {
          e.preventDefault();
          if (passcode === 'quzman2026') {
            setIsTeacher(true);
            setView('teacher-dashboard');
            setError('');
          } else {
            setError('كلمة السر غير صحيحة!');
          }
        };

        return (
          <div class="min-h-screen bg-gradient-to-b from-indigo-50 to-white">
            {/* Header */}
            <header class="bg-indigo-600 text-white p-4 shadow-lg">
              <div class="max-w-4xl mx-auto flex justify-between items-center">
                <h1 class="text-xl font-bold cursor-pointer" onClick={() => setView('home')}>
                  🎓 Quzman in English
                </h1>
                <button 
                  onClick={() => setView(isTeacher ? 'teacher-dashboard' : 'teacher-login')}
                  class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-2 rounded-lg transition"
                >
                  {isTeacher ? 'لوحة المعلم' : 'دخول المعلم'}
                </button>
              </div>
            </header>

            {/* Main Content */}
            <main class="max-w-4xl mx-auto p-4 mt-6">
              {view === 'home' && (
                <div class="text-center py-10 space-y-6">
                  <h2 class="text-3xl font-extrabold text-indigo-900">أهلاً بكم في منصة Quzman in English</h2>
                  <p class="text-slate-600 max-w-lg mx-auto">
                    منصة تعليمية متكاملة لطلاب المرحلة الثانوية والإعدادية لتعلم اللغة الإنجليزية بسهولة وإتقان.
                  </p>
                  
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-md mx-auto mt-8">
                    <button 
                      onClick={() => setView('student-dashboard')}
                      class="bg-indigo-600 hover:bg-indigo-700 text-white p-6 rounded-2xl shadow-md font-bold text-lg transition flex flex-col items-center justify-center space-y-2"
                    >
                      <span>👨‍🎓</span>
                      <span>دخول الطلاب</span>
                    </button>
                    
                    <button 
                      onClick={() => setView('teacher-login')}
                      class="bg-white border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50 p-6 rounded-2xl shadow-sm font-bold text-lg transition flex flex-col items-center justify-center space-y-2"
                    >
                      <span>👨‍🏫</span>
                      <span>لوحة المعلم</span>
                    </button>
                  </div>
                </div>
              )}

              {/* Student Dashboard */}
              {view === 'student-dashboard' && (
                <div class="space-y-6">
                  <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold text-slate-800">منصة الطالب 📚</h2>
                    <button onClick={() => setView('home')} class="text-sm text-indigo-600 font-bold">الرئيسية ←</button>
                  </div>
                  
                  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                      <div class="text-indigo-600 font-bold text-lg mb-2">الصف الأول الثانوي</div>
                      <p class="text-xs text-slate-500 mb-4">كورس القواعد والكلمات الشامل</p>
                      <button class="w-full bg-indigo-50 text-indigo-600 py-2 rounded-xl text-sm font-bold hover:bg-indigo-100">عرض الدروس</button>
                    </div>

                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                      <div class="text-indigo-600 font-bold text-lg mb-2">الصف الثاني الثانوي</div>
                      <p class="text-xs text-slate-500 mb-4">شرح المنهج واختبارات تفاعلية</p>
                      <button class="w-full bg-indigo-50 text-indigo-600 py-2 rounded-xl text-sm font-bold hover:bg-indigo-100">عرض الدروس</button>
                    </div>

                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                      <div class="text-indigo-600 font-bold text-lg mb-2">الصف الثالث الثانوي</div>
                      <p class="text-xs text-slate-500 mb-4">مراجعات ومقالات وحل امتحانات</p>
                      <button class="w-full bg-indigo-50 text-indigo-600 py-2 rounded-xl text-sm font-bold hover:bg-indigo-100">عرض الدروس</button>
                    </div>
                  </div>
                </div>
              )}

              {/* Teacher Login */}
              {view === 'teacher-login' && (
                <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-md border border-slate-100">
                  <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">تسجيل دخول المعلم 🔐</h2>
                  <form onSubmit={handleTeacherLogin} class="space-y-4">
                    <div>
                      <label class="block text-sm font-medium text-slate-700 mb-1">كلمة المرور</label>
                      <input 
                        type="password" 
                        value={passcode}
                        onChange={(e) => setPasscode(e.target.value)}
                        placeholder="أدخل كلمة المرور"
                        class="w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                    {error && <p class="text-red-500 text-xs">{error}</p>}
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition">
                      دخول
                    </button>
                  </form>
                </div>
              )}

              {/* Teacher Dashboard */}
              {view === 'teacher-dashboard' && (
                <div class="space-y-6">
                  <div class="flex justify-between items-center bg-indigo-900 text-white p-6 rounded-2xl">
                    <div>
                      <h2 class="text-2xl font-bold">لوحة تحكم المعلم 🛠️</h2>
                      <p class="text-xs text-indigo-200">إدارة المحتوى والاختبارات والطلاب</p>
                    </div>
                    <button onClick={() => { setIsTeacher(false); setView('home'); }} class="bg-red-500 text-white text-xs px-3 py-2 rounded-lg">
                      تسجيل خروج
                    </button>
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-3">
                      <h3 class="font-bold text-slate-800">إضافة درس جديد</h3>
                      <input type="text" placeholder="عنوان الدرس" class="w-full p-2 border rounded-lg text-sm" />
                      <textarea placeholder="محتوى الدرس أو رابط الفيديو" class="w-full p-2 border rounded-lg text-sm h-24"></textarea>
                      <button class="bg-indigo-600 text-white text-sm font-bold px-4 py-2 rounded-lg">نشر الدرس</button>
                    </div>

                    <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-3">
                      <h3 class="font-bold text-slate-800">إحصائيات المنصة</h3>
                      <div class="flex justify-between border-b pb-2 text-sm">
                        <span>إجمالي الطلاب المسجلين:</span>
                        <span class="font-bold text-indigo-600">124</span>
                      </div>
                      <div class="flex justify-between border-b pb-2 text-sm">
                        <span>الدروس المنشورة:</span>
                        <span class="font-bold text-indigo-600">18</span>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
